name: Security check - ESLint

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - staging
      - main
      - master
      - qa

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stefanoeb/eslint-action@1.0.2
        continue-on-error: true